<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 548" width="1100" height="548" role="img" aria-label="certway architecture: CLI crate and core crate">
  <title>Two crates: certway (CLI) and certway-core (protocol &amp; crypto)</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#57606A"/>
    </marker>
    <style> .s { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif; } </style>
  </defs>

  <!-- boxes -->
  <rect x="32" y="56" width="300" height="390" rx="20" fill="#0D1117" stroke="#30363D"/>
  <path d="M32 76a20 20 0 0 1 20-20h260a20 20 0 0 1 20 20v36H32z" fill="#8B5CF6" fill-opacity=".16"/>
  <text x="52" y="90" class="s" font-size="19" font-weight="800" fill="#C4B5FD">certway — the CLI</text>
  <text x="52" y="140" class="s" font-size="13" font-weight="700" letter-spacing="2" fill="#8B949E">WHAT YOU SEE</text>

  <rect x="396" y="56" width="372" height="402" rx="20" fill="#0D1117" stroke="#30363D"/>
  <path d="M396 76a20 20 0 0 1 20-20h332a20 20 0 0 1 20 20v36H396z" fill="#22D3EE" fill-opacity=".14"/>
  <text x="416" y="90" class="s" font-size="18.5" font-weight="800" fill="#67E8F9">certway-core — protocol &amp; crypto</text>
  <text x="416" y="140" class="s" font-size="13" font-weight="700" letter-spacing="2" fill="#8B949E">NEVER PRINTS — clippy::print IS DENIED</text>

    <g transform="translate(64 160)">
      <rect width="236" height="58" rx="12" fill="#FFFFFF" fill-opacity=".05" stroke="#8B5CF6" stroke-opacity=".38"/>
      <text x="16" y="25" class="s" font-size="14.5" font-weight="700" fill="#E2E8F0">args · help · i18n</text>
      <text x="16" y="45" class="s" font-size="12.5" fill="#8B949E">every flag, every message</text>
    </g>
    <g transform="translate(64 232)">
      <rect width="236" height="58" rx="12" fill="#FFFFFF" fill-opacity=".05" stroke="#8B5CF6" stroke-opacity=".38"/>
      <text x="16" y="25" class="s" font-size="14.5" font-weight="700" fill="#E2E8F0">human  |  --json</text>
      <text x="16" y="45" class="s" font-size="12.5" fill="#8B949E">one run, two renderers</text>
    </g>
    <g transform="translate(64 304)">
      <rect width="236" height="58" rx="12" fill="#FFFFFF" fill-opacity=".05" stroke="#8B5CF6" stroke-opacity=".38"/>
      <text x="16" y="25" class="s" font-size="14.5" font-weight="700" fill="#E2E8F0">store · nginx · timer</text>
      <text x="16" y="45" class="s" font-size="12.5" fill="#8B949E">files, edits, renewal</text>
    </g>

    <g transform="translate(430 160)">
      <rect width="300" height="58" rx="12" fill="#FFFFFF" fill-opacity=".05" stroke="#22D3EE" stroke-opacity=".38"/>
      <text x="16" y="25" class="s" font-size="14.5" font-weight="700" fill="#E2E8F0">ACME client</text>
      <text x="16" y="45" class="s" font-size="12.5" fill="#8B949E">account · order · challenge · ARI</text>
    </g>
    <g transform="translate(430 232)">
      <rect width="300" height="58" rx="12" fill="#FFFFFF" fill-opacity=".05" stroke="#22D3EE" stroke-opacity=".38"/>
      <text x="16" y="25" class="s" font-size="14.5" font-weight="700" fill="#E2E8F0">DNS-01</text>
      <text x="16" y="45" class="s" font-size="12.5" fill="#8B949E">Cloudflare · external hook</text>
    </g>
    <g transform="translate(430 304)">
      <rect width="300" height="58" rx="12" fill="#FFFFFF" fill-opacity=".05" stroke="#22D3EE" stroke-opacity=".38"/>
      <text x="16" y="25" class="s" font-size="14.5" font-weight="700" fill="#E2E8F0">ring · P-256</text>
      <text x="16" y="45" class="s" font-size="12.5" fill="#8B949E">zeroize on drop, no unsafe</text>
    </g>
    <g transform="translate(430 376)">
      <rect width="300" height="58" rx="12" fill="#FFFFFF" fill-opacity=".05" stroke="#22D3EE" stroke-opacity=".38"/>
      <text x="16" y="25" class="s" font-size="14.5" font-weight="700" fill="#E2E8F0">rustls 0.23</text>
      <text x="16" y="45" class="s" font-size="12.5" fill="#8B949E">no OpenSSL, no C toolchain</text>
    </g>

  <!-- external targets -->
  <g transform="translate(840 96)">
    <rect width="228" height="104" rx="16" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".55" stroke-dasharray="7 6"/>
    <text x="20" y="42" class="s" font-size="17" font-weight="800" fill="#4ADE80">Let's Encrypt</text>
    <text x="20" y="68" class="s" font-size="14" fill="#8B949E">or any ACME server</text>
    <text x="20" y="89" class="s" font-size="12.5" fill="#6E7681">staging · production · private</text>
  </g>
  <g transform="translate(840 320)">
    <rect width="228" height="88" rx="16" fill="#F59E0B" fill-opacity=".1" stroke="#F59E0B" stroke-opacity=".55" stroke-dasharray="7 6"/>
    <text x="20" y="40" class="s" font-size="17" font-weight="800" fill="#FBBF24">your DNS provider</text>
    <text x="20" y="66" class="s" font-size="14" fill="#8B949E">TXT record for DNS-01</text>
  </g>

  <!-- arrows -->
  <line x1="332" y1="246" x2="394" y2="246" stroke="#57606A" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="768" y1="150" x2="838" y2="150" stroke="#57606A" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="768" y1="364" x2="838" y2="364" stroke="#57606A" stroke-width="2.5" marker-end="url(#ah)"/>
  <g>
    <rect x="770" y="112" width="76" height="24" rx="12" fill="#0D1117" stroke="#30363D"/>
    <rect x="772" y="326" width="74" height="24" rx="12" fill="#0D1117" stroke="#30363D"/>
    <rect x="340" y="208" width="54" height="24" rx="12" fill="#0D1117" stroke="#30363D"/>
  </g>
  <text x="808" y="129" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#E2E8F0" text-anchor="middle">HTTPS</text>
  <text x="809" y="343" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#E2E8F0" text-anchor="middle">TXT</text>
  <text x="367" y="225" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#E2E8F0" text-anchor="middle">calls</text>

  <!-- caption -->
  <text x="550" y="528" class="s" font-size="15.5" font-style="italic" fill="#7D8590" text-anchor="middle">Everything human — or JSON — is rendered by the CLI layer. The core crate has no printer.</text>
</svg>
