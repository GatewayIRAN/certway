<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="renewal decision: ARI from the CA when advertised, 30 days before expiry otherwise, run by a systemd timer or cron">
<title>renewal decision: ARI from the CA when advertised, 30 days before expiry otherwise, run by a systemd timer or cron</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B18"/><stop offset=".55" stop-color="#0C1230"/><stop offset="1" stop-color="#131A3E"/></linearGradient>
<linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity=".04" stroke-width="1"/></pattern>
<radialGradient id="r1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7C3AED" stop-opacity=".4"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient><radialGradient id="r2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#06B6D4" stop-opacity=".35"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
<style> .s { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif; } .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; } </style>
</defs>
<rect width="1200" height="320" fill="url(#bg)"/>
<rect width="1200" height="320" fill="url(#grid)"/>
<ellipse cx="1160" cy="300" rx="320" ry="180" fill="url(#r1)" opacity=".45"/>
<ellipse cx="60" cy="10" rx="300" ry="160" fill="url(#r2)" opacity=".35"/>
<rect x="40" y="40" width="250" height="92" rx="14" fill="#0E1429" stroke="#A78BFA" stroke-opacity=".45"/>
<text class="s" x="165.0" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#F0F6FC">certway renew --all</text>
<text class="s" x="165.0" y="92" text-anchor="middle" font-size="12" fill="#93A0B4">runs on a schedule,</text>
<text class="s" x="165.0" y="108" text-anchor="middle" font-size="12" fill="#93A0B4">renews only what is due</text>
<path d="M294 86H384" stroke="#3B4A6B" stroke-width="2" stroke-linecap="round"/>
<path d="M378 82l6 4-6 4" fill="none" stroke="#3B4A6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M470 30l86 56-86 56-86-56z" fill="#0E1429" stroke="#22D3EE" stroke-opacity=".5"/>
<text class="s" x="470" y="78" text-anchor="middle" font-size="13.5" font-weight="700" fill="#F0F6FC">CA names a window?</text>
<text class="s" x="470" y="96" text-anchor="middle" font-size="11.5" fill="#8B94A8">ARI, RFC 9773</text>
<path d="M560 86H650" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
<path d="M644 56l6 4-6 4" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="s" x="605.0" y="77" text-anchor="middle" font-size="11.5" font-weight="600" fill="#34D399">yes</text>
<rect x="654" y="22" width="280" height="76" rx="14" fill="#0E1429" stroke="#34D399" stroke-opacity=".45"/>
<text class="s" x="794.0" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#F0F6FC">renew inside that window</text>
<text class="s" x="794.0" y="74" text-anchor="middle" font-size="12" fill="#93A0B4">the authority names the time;</text>
<text class="s" x="794.0" y="90" text-anchor="middle" font-size="12" fill="#93A0B4">the client does not guess</text>
<path d="M560 86H650" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
<path d="M644 146l6 4-6 4" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="s" x="605.0" y="77" text-anchor="middle" font-size="11.5" font-weight="600" fill="#F59E0B">no</text>
<rect x="654" y="112" width="280" height="76" rx="14" fill="#0E1429" stroke="#F59E0B" stroke-opacity=".45"/>
<text class="s" x="794.0" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#F0F6FC">renew 30 days before expiry</text>
<text class="s" x="794.0" y="164" text-anchor="middle" font-size="12" fill="#93A0B4">the fallback when the CA</text>
<text class="s" x="794.0" y="180" text-anchor="middle" font-size="12" fill="#93A0B4">advertises nothing</text>
<path d="M940 60H1000" stroke="#3B4A6B" stroke-width="2" stroke-linecap="round"/>
<path d="M994 82l6 4-6 4" fill="none" stroke="#3B4A6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M940 150H1000" stroke="#3B4A6B" stroke-width="2" stroke-linecap="round"/>
<path d="M994 86l6 4-6 4" fill="none" stroke="#3B4A6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1004" y="44" width="156" height="84" rx="14" fill="#0E1429" stroke="#22D3EE" stroke-opacity=".45"/>
<text class="s" x="1082.0" y="74" text-anchor="middle" font-size="15" font-weight="700" fill="#F0F6FC">renewed</text>
<text class="s" x="1082.0" y="96" text-anchor="middle" font-size="12" fill="#93A0B4">same order flow,</text>
<text class="s" x="1082.0" y="112" text-anchor="middle" font-size="12" fill="#93A0B4">new files, 0600</text>
<text class="s" x="40" y="212" font-size="12" font-weight="700" letter-spacing="2.6" fill="#7D8590">WHO RUNS IT</text>
<rect x="40" y="226" width="1120" height="60" rx="14" fill="#0A0F24" stroke="#FFFFFF" stroke-opacity=".07"/>
<circle cx="70" cy="256" r="5" fill="#60A5FA"/>
<text class="s" x="86" y="252" font-size="14.5" font-weight="700" fill="#F0F6FC">systemd timer</text>
<text class="s" x="86" y="271" font-size="12" fill="#8B94A8">where systemd exists</text>
<circle cx="442" cy="256" r="5" fill="#F59E0B"/>
<text class="s" x="458" y="252" font-size="14.5" font-weight="700" fill="#F0F6FC">cron entry</text>
<text class="s" x="458" y="271" font-size="12" fill="#8B94A8">where it does not</text>
<circle cx="814" cy="256" r="5" fill="#A78BFA"/>
<text class="s" x="830" y="252" font-size="14.5" font-weight="700" fill="#F0F6FC">in a container</text>
<text class="s" x="830" y="271" font-size="12" fill="#8B94A8">prints the schedule to run instead</text>
<rect x=".5" y=".5" width="1199" height="319" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity=".1"/>
</svg>
