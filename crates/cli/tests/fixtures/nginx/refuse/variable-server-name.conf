events {}
http {
    map $http_host $vhost {
        default $http_host;
    }

    server {
        listen 443 ssl;
        server_name $vhost;
        ssl_certificate /etc/certway-test-certs/example.com/fullchain.pem;
        ssl_certificate_key /etc/certway-test-certs/example.com/privkey.pem;
    }
}
