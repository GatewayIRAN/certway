events {}
http {
    # Two blocks both claiming the same exact server_name on the same
    # address:port. Real nginx would log
    # `[warn] conflicting server name "example.com" on 0.0.0.0:443, ignored`
    # and silently keep only the first at runtime (exit code 0 — verified
    # against the pinned container, docs/ref/nginx-config-1.29.3.md's
    # documented trap). certway refuses instead of guessing which one the
    # user meant.
    server {
        listen 443 ssl;
        server_name example.com;
        ssl_certificate /etc/certway-test-certs/example.com/fullchain-a.pem;
        ssl_certificate_key /etc/certway-test-certs/example.com/privkey-a.pem;
    }
    server {
        listen 443 ssl;
        server_name example.com;
        ssl_certificate /etc/certway-test-certs/example.com/fullchain-b.pem;
        ssl_certificate_key /etc/certway-test-certs/example.com/privkey-b.pem;
    }
}
