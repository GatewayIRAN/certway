events {}
http {
    server {
        listen 443 ssl;
        server_name other.example.com;
        ssl_certificate /etc/certway-test-certs/example.com/fullchain.pem;
        ssl_certificate_key /etc/certway-test-certs/example.com/privkey.pem;

        # nginx's `if` is famously non-local — a server_name found only
        # inside one is not trusted as a real match.
        if ($http_x_debug = "on") {
            server_name debug.example.com;
        }
    }
}
